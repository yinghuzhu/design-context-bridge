name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality gate
        run: npm run check

      - name: Smoke test repository installer
        if: matrix.node == 20
        shell: bash
        run: |
          smoke_root=$(mktemp -d "$RUNNER_TEMP/design-context-install.XXXXXX")
          smoke_home="$smoke_root/home"
          smoke_install="$smoke_root/share/design-context-bridge"
          smoke_bin="$smoke_root/bin"
          mkdir -p "$smoke_home"
          ./scripts/install.sh \
            --home "$smoke_home" \
            --install-root "$smoke_install" \
            --bin-dir "$smoke_bin" \
            --skip-check
          "$smoke_bin/design-context" --version
          test -f "$smoke_home/.agents/skills/design-replicate/SKILL.md"
          test -f "$smoke_home/.claude/skills/design-replicate/SKILL.md"
